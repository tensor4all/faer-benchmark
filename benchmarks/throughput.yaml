# Chart configuration for scripts/throughput_report.py. Nothing here is a measurement: the operation
# count per family is the algorithmic count used to turn a time into a nominal GFLOP/s figure, and the
# series say which engine row of which recorded run becomes which line. Nominal GFLOP/s is therefore
# comparable across sizes within one family, and not across families.
version: v2
page:
  title: "Throughput charts - timing-v2 baseline (faer-kernels)"
  notes:
    - "Generated by `scripts/throughput_report.py` from the recorded runs below; no timing is run here."
    - "**Nominal** GFLOP/s: one algorithmic operation count per family, so sizes are comparable within a family and absolute values are not comparable across families. The count is stated under every chart and in each data table."
    - "Error bars are the between-start sample SD of the process medians, not a confidence interval. The `!` cells of the measured pages are included as they were recorded."
    - "`faer-fork`, `faer-upstream` and `lapack-mkl` come from one recorded run and therefore from one process each; `lapack-openblas` comes from the other arm (its own binary), so its absolute level carries the between-arm uncertainty."
    - "Recorded sizes: the daily suite gives 32-768 at 1T/4T/8T; the large-tier run adds 1024 at 4T and 8T for the plotted families (f64, C order). A line stops where a size was not measured - nothing is interpolated."
series:
  - engine: faer-fork
    run: [0, 2]       # arguments 0/2: the daily and the large-tier run of the arm that carries upstream
    colour: "#1f77b4"
    marker: circle
    width: 1.9        # the fork is the subject of the campaign: solid, thicker, drawn last
    size: 4.2
  - engine: faer-upstream
    run: [0, 2]
    colour: "#1f77b4"
    marker: circle
    dash: "5 3"
    size: 2.2
  - engine: lapack-mkl
    run: [0, 2]
    colour: "#2ca02c"
    marker: triangle
    size: 3.0
  - engine: lapack-openblas
    run: [1, 3]
    colour: "#d62728"
    marker: diamond
    size: 3.0
families:
  gemm:        {coefficient: 2.0,     label: "2n^3"}
  lu:          {coefficient: 0.66667, label: "2n^3/3"}
  full_piv_lu: {coefficient: 0.66667, label: "2n^3/3 (no vendor row: unsupported)"}
  cholesky:    {coefficient: 0.33333, label: "n^3/3"}
  qr_factor:   {coefficient: 1.33333, label: "4n^3/3 (compact factors)"}
  qr:          {coefficient: 2.66667, label: "8n^3/3 (factors and explicit Q)"}
  svd_values:  {coefficient: 4.0,     label: "4n^3 (singular values only)"}
  svd_thin:    {coefficient: 10.0,    label: "~10n^3 (Golub-Kahan, implementation dependent)"}
  eigh:        {coefficient: 2.66667, label: "8n^3/3 (self-adjoint, vectors)"}
