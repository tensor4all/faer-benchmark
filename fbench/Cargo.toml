# Measurement harness `fbench`.
#
# The harness owns `info`, `verify` and `run` over the faer entry points the
# suite declares, with the flags the recorder calls it with: --threads --n
# --batch --dtype --family --regime --reps --prime-ms --csv.
#
# The two faer libraries are linked *by path*: `scripts/build_for_faer_rev.sh`
# patches the registry entries below to the checkouts it is given. They are
# ordinary registry dependencies here, named `t4a-faer` (the fork, the measured
# library) and `faer` (upstream, the baseline), so a `cargo build` resolves them
# from crates.io unless the build script patches them. Both declare `[lib] name =
# "faer"` but they are distinct dependency keys and therefore distinct Rust crate
# identities; their `Mat`, `Par` and trait types are not interchangeable, so the
# adapter in `src/backend.rs` is a macro expanded once per crate.
#
# One binary links one vendor library -- MKL and OpenBLAS define the same
# symbols -- so an arm is its own build and its own feature. `link-openblas`
# links OpenBLAS statically (`openblas-src/static`) so the recorder can execute
# the binary directly with no loader search path; `link-mkl` links the installed
# Intel oneAPI MKL, whose versioned paths the build script resolves and exports
# as `MKLROOT`/`MKL_THREADING_LIB`.
[package]
name = "fbench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# The measured fork has the 0.25 parallelism API (`Par<'team>`, `ParShape` for workspace queries, no process-wide
# setting). Set by `scripts/build_for_faer_rev.sh` from the fork checkout; see `backend::fork_par`.
fork-par-shape = []
# The measured fork has the team API (tensor4all/faer#85: `faer::team::with_team`, the only
# parallel route; from 0.26 `Par::rayon` is gone, from 0.27 on threadteam 0.2). Set by
# `scripts/build_for_faer_rev.sh` when the checkout declares `with_team`; a checkout that still
# has `Par::rayon` is measured through the spindle group as before.
fork-team = ["faer_fork/threadteam"]
link-openblas = [
    "dep:blas-src",
    "dep:lapack-src",
    "dep:openblas-src",
    "blas-src/openblas",
    "lapack-src/openblas",
    "openblas-src/static",
]
link-mkl = [
    "dep:blas-src",
    "dep:lapack-src",
    "blas-src/intel-mkl-dynamic-parallel",
    "lapack-src/intel-mkl-dynamic-parallel",
]

[dependencies]
# The range spans every fork generation the build script can detect (0.24.x, 0.25 `ParShape`,
# 0.26/0.27 team-only); the pinned checkout is what is linked.
faer_fork = { package = "t4a-faer", version = ">=0.24, <0.28", default-features = false, features = ["std", "rayon"] }
faer_upstream = { package = "faer", version = "0.24", default-features = false, features = ["std", "rayon"] }
# The thread-pool helper upstream `faer` issues its parallel regions through, the same crate
# instance as its own (one 0.2.x resolves for both): the harness holds the worker group around
# the upstream row's timed loop when the budget is more than one thread. A fork checkout without
# the team API (before 0.26) used it the same way; with `fork-team` the fork row runs on a
# threadteam team of the same budget instead (`main.rs` `measure_row`).
spindle = "0.2.6"
# The complex scalar type the two faer crates also re-export. Declared directly so
# the provider-independent reference math in `src/shared.rs` does not have to name
# one of the two faer crates.
num-complex = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1"

# The vendor source crates only emit the native link flags; the harness declares
# the CBLAS/LAPACKE symbols it calls itself (see `src/lapack.rs`). `blas-src` and
# `lapack-src` mirror each other's backend features, and `openblas-src` is named
# directly only to reach its `static` feature.
blas-src = { version = "0.14", default-features = false, optional = true }
lapack-src = { version = "0.13", default-features = false, optional = true }
openblas-src = { version = "0.10", optional = true }
