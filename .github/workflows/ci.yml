name: ci
on: [push, pull_request]
# The measurement itself runs locally: `scripts/record_run.py` builds, verifies and times the
# pinned checkout on the host that owns the numbers, and refuses to publish otherwise, so the
# harness's buildability is proven where it matters. What is left for this repository is content:
# the declarations, every recorded manifest, and the generated index. That is one small job on the
# smallest runner, and it is the only required check on `main`.
#
# There is deliberately no smoke build here. Recording a run requires that exact revision to have
# already built, verified and timed on the measuring host, so a build gate would be post hoc by
# construction; a pin moved by hand still shows up as a stale or missing cell in the index, which
# is the check that stays. The sibling campaign removed its smoke job for the same reason
# (tlinalg-benchmark worklog, 2026-10-13 "later still").
#
# No measured checkout is cloned here either. `fbench` links the two libraries by path, and
# `gen_index.py --check` reports the absent `extern/` checkouts only when there is a recorded page
# whose currency they would decide; with nothing recorded there is nothing to date.
jobs:
  index:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Declarations are well formed
        run: |
          python3 - <<'PY'
          import json, yaml, jsonschema, pathlib
          root = pathlib.Path('.')
          run = json.loads((root/'schemas/benchmark-run.schema.json').read_text())
          suite = json.loads((root/'schemas/benchmark-suite.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(run)
          jsonschema.Draft202012Validator.check_schema(suite)
          names = {p['name'] for p in yaml.safe_load((root/'benchmarks/profiles.yaml').read_text())['profiles']}
          for f in (root/'benchmarks/suites').glob('*.yaml'):
              data = yaml.safe_load(f.read_text())
              jsonschema.validate(data, suite)
              groups = set(data['family_groups'])
              for spec in data['runs']:
                  regimes = [p['regime'] for p in spec['populations']]
                  dups = sorted({r for r in regimes if regimes.count(r) > 1})
                  assert not dups, (f'{f}: regime label(s) {dups} name more than one population; '
                                    'a regime is a population identity, because the raw-data names, '
                                    'skip keys and report tables are keyed by it')
                  for population in spec['populations']:
                      unknown = set(population['groups']) - groups
                      assert not unknown, f'{f}: population names unknown groups {sorted(unknown)}'
              for p in data['required_profiles'] + data.get('optional_profiles', []):
                  assert p in names, f'{f}: unknown profile {p}'
          print('declarations ok')
          PY
      - name: Every recorded run manifest validates
        run: |
          shopt -s nullglob
          files=(data/results/*/*/*/run.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no runs recorded yet"; exit 0; fi
          python3 scripts/validate_run.py "${files[@]}"
      - name: Index is current, required cells present
        run: python3 scripts/gen_index.py --check
