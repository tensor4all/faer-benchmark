name: ci
on: [push, pull_request]
# The measurement itself runs locally: `scripts/record_run.py` builds, verifies and times the
# pinned checkouts on the host that owns the numbers, and refuses to publish otherwise, so the
# harness's buildability is proven where it matters. What is left for this repository is content:
# the declarations, every recorded manifest, and the generated index. That is one small job on the
# smallest runner, and it is the only required check on `main`.
#
# There is deliberately no smoke build here. Recording a run requires those exact revisions to have
# already built, verified and timed on the measuring host, so a build gate would be post hoc by
# construction; a pin moved by hand still shows up as a stale or missing cell in the index, which
# is the check that stays. The sibling campaign removed its smoke job for the same reason
# (tlinalg-benchmark worklog, 2026-10-13 "later still").
#
# The tooling is no longer duplicated here: `requirements.txt` pins `campaign-toolkit`, and each
# `scripts/*.py` is a thin shim over its entry point.
#
# The two reference checkouts are materialised because currency is a property of recorded
# evidence: with a page in the tree, `gen_index.py --check` has to say whether it is current, and
# it can only do that against the pinned revisions. With nothing recorded there is no currency to
# compute and the checkouts are not needed, but they are cheap and the step is unconditional.
jobs:
  index:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Python deps
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Checkout the two reference revisions
        run: ./scripts/setup_extern_deps.sh
      - name: Declarations are well formed
        run: python3 -m campaign_toolkit.declarations
      - name: Every recorded run manifest validates
        run: |
          shopt -s nullglob
          files=(data/results/*/*/*/run.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no runs recorded yet"; exit 0; fi
          python3 scripts/validate_run.py "${files[@]}"
      - name: Index is current, required cells present
        run: python3 scripts/gen_index.py --check
