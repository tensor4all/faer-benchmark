name: pages

# The landing page is generated here on every deploy (it is not committed), so the deployed
# artifact always reflects main. The recorded pages are Markdown, which a browser does not render; this publishes
# the generated HTML view of the same data (the four-way comparison and the
# landing page) so the campaign is browsable without checking the repository out.
#
# The campaign's work lives on `perf/upstream-regression-campaign` until it is
# merged, so that branch deploys too; `main` is what a reader should quote once
# the branch has landed.
on:
  push:
    branches: [main, perf/upstream-regression-campaign]
    paths: [result/**, 'pins/**', requirements.txt, 'scripts/gen_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history.html reads the publication commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned toolkit
        run: python -m pip install --quiet -r requirements.txt
      - name: Write the landing page
        # generated on every deploy from the committed result and pins; not committed
        run: python scripts/gen_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: result
      - id: deployment
        uses: actions/deploy-pages@v4
